<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">CrewAI iMessage agent architecture</title>
<desc id="desc">Text messages enter through Sendblue and FastAPI, are persisted in Supabase PostgreSQL, and are processed by a CrewAI worker using OpenAI. Replies return through Sendblue. A Python scheduler queues reminders and briefings from saved schedules. Optional Gmail and GitHub accounts connect through Composio MCP. Browserbase and Playwright support public web research. The project is experimental; the Render deployment blueprint is prepared but hosting is not live.</desc>
