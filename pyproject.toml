[project]
name = "crewai-open-instinct"
version = "0.1.0"
description = "Experimental tenant-scoped iMessage assistant using CrewAI, Supabase, Sendblue and Browserbase"
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai==1.15.23",
    "fastapi>=0.118,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "playwright>=1.49,<2",
    "composio==0.25.0",
    "composio-client==2.0.0rc8",
    "mcp==1.28.1",
]

[project.scripts]
kickoff = "crewai_open_instinct.main:kickoff"
serve = "crewai_open_instinct.api:serve"
worker = "crewai_open_instinct.worker:run"
preflight = "crewai_open_instinct.preflight:run"
scheduler = "crewai_open_instinct.schedules:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[dependency-groups]
dev = ["pytest>=8,<9", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
